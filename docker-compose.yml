# Nirapad Courier: client (nginx) + API (Express) + MongoDB, routed by Traefik.
# Copy .env.example to .env and fill it in, then: docker compose up -d --build

services:
  client:
    build: ./client
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=nirapad-web
      # HTTPS router for the site
      - traefik.http.routers.nirapad-web.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.nirapad-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.nirapad-web.tls=true
      - traefik.http.routers.nirapad-web.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.nirapad-web.loadbalancer.server.port=80

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MONGODB_URI: mongodb://${MONGO_USER:-nirapad}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/nirapad_courier?authSource=admin
    networks: [web, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=nirapad-web
      # Same domain, /api goes to the API (the client calls /api/v1 on its own origin)
      - traefik.http.routers.nirapad-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.nirapad-api.priority=100
      - traefik.http.routers.nirapad-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.nirapad-api.tls=true
      - traefik.http.routers.nirapad-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.nirapad-api.loadbalancer.server.port=5001

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nirapad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks: [internal]   # not reachable from Traefik or the internet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # Traefik (even in host network mode) reaches containers by their IP on this network
  web:
    name: nirapad-web
  # API <-> MongoDB only; no outside access
  internal:
    internal: true

volumes:
  mongo-data:
